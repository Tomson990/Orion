name: ORION Data Update

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 Argentina (mañana)
    - cron: '0 16 * * *'   # 13:00 Argentina (mediodía)
    - cron: '0 23 * * *'   # 20:00 Argentina (noche)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update commodity prices
        run: |
          echo "Actualizando precios - $(date)"
          python3 main.py --commodities
          echo "Precios actualizados"

      - name: Commit updated database
        run: |
          git config --global user.name "ORION Bot"
          git config --global user.email "orion@github-actions"
          git add data/orion.db
          git diff --staged --quiet || git commit -m "data: precios actualizados $(date +'%Y-%m-%d %H:%M') ART"
          git push
